<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Family Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800&family=Nunito:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Nunito, system-ui, sans-serif;
        background: radial-gradient(circle at top, #2a1b55, #070814 60%);
        color: #fff;
      }
      .wrap {
        max-width: 820px;
        margin: 0 auto;
        padding: 48px 20px;
      }
      h1 {
        font-family: Orbitron, sans-serif;
        text-align: center;
        letter-spacing: 2px;
      }
      .grid {
        display: grid;
        gap: 20px;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        margin-top: 32px;
      }
      a.card {
        display: block;
        text-decoration: none;
        color: inherit;
        background: #141428;
        border: 3px solid #ffd24a;
        border-radius: 16px;
        padding: 22px;
      }
      a.card:hover {
        filter: brightness(1.08);
      }
      a.card h2 {
        font-family: Orbitron, sans-serif;
        margin: 0 0 10px;
        font-size: 18px;
      }
      a.card p {
        margin: 0;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>FAMILY GAMES</h1>
      <div class="grid">
        <a class="card" href="transformers/index.html">
          <h2>TRANSFORMERS</h2>
          <p>A long pig run, power-ups, then whale bosses that blast oversized tomatoes.</p>
        </a>
        <a class="card" href="santiago-face-attack.html">
          <h2>SANTIAGO FACE ATTACK</h2>
          <p>Pac-Man maze. Dodge the Santiago faces and eat the pellets.</p>
        </a>
      </div>
    </div>
  </body>
</html>
